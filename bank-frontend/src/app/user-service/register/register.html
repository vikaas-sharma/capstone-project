<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4 rounded-4" style="width: 400px; border: none;">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary">Register</h2>
      <p class="text-muted">Create your account below</p>
    </div>
    
    <form #registerForm="ngForm" (ngSubmit)="onSubmit()">
      <div class="form-floating mb-3">
        <input 
          type="text"
          [(ngModel)]="user.username"
          name="username"
          #username="ngModel"
          id="username"
          placeholder="Username"
          class="form-control rounded-pill shadow-sm"
          [class.is-invalid]="username.invalid && username.touched"
          required>
        <label for="username">Username *</label>
        <div class="invalid-feedback" *ngIf="username.invalid && username.touched">
          <small>Please enter a username</small>
        </div>
      </div>
      
      <div class="form-floating mb-3">
        <input 
          type="password"
          [(ngModel)]="user.password"
          name="password"
          #password="ngModel"
          id="password"
          placeholder="Password"
          class="form-control rounded-pill shadow-sm"
          [class.is-invalid]="password.invalid && password.touched"
          required>
        <label for="password">Password *</label>
        <div class="invalid-feedback" *ngIf="password.invalid && password.touched">
          <small>Please enter a password</small>
        </div>
      </div>
      
      <div class="form-floating mb-3">
        <input 
          type="text"
          [(ngModel)]="user.address"
          name="address"
          id="address"
          placeholder="Address"
          class="form-control rounded-pill shadow-sm">
        <label for="address">Address (Optional)</label>
      </div>
      
      <button 
        type="submit"
        class="btn btn-success w-100 rounded-pill btn-lg shadow"
        [disabled]="registerForm.invalid">
        Register
      </button>
    </form>
    
    <div class="text-center mt-3">
      <small class="text-muted">
        Already have an account? 
        <a routerLink="/login" class="text-decoration-none fw-semibold">Login</a>
      </small>
    </div>
  </div>
</div>
