<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4 rounded-4" style="width: 400px; border: none;">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary">Login</h2>
      <p class="text-muted">Welcome back! Please login to continue.</p>
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="mb-3">
        <input 
          type="text" 
          [(ngModel)]="credentials.username" 
          name="username" 
          placeholder="Username" 
          class="form-control form-control-lg rounded-pill shadow-sm">
      </div>

      <div class="mb-3">
        <input 
          type="password" 
          [(ngModel)]="credentials.password" 
          name="password" 
          placeholder="Password" 
          class="form-control form-control-lg rounded-pill shadow-sm">
      </div>

      <button 
        type="submit" 
        class="btn btn-primary w-100 rounded-pill btn-lg shadow">
        Login
      </button>
    </form>

    <div class="text-center mt-3">
      <small class="text-muted">
        Don’t have an account? 
        <a routerLink="/register" class="text-decoration-none fw-semibold">Register</a>
      </small>
    </div>
  </div>
</div>
